# Builds Blink Shell (https://github.com/blinksh/blink) from source into an
# .ipa that SideStore can sign and install on your iPhone. No Mac needed:
# everything runs on GitHub's macOS machines.
#
# Put this file in a NEW, EMPTY, PUBLIC repository at
#   .github/workflows/build.yml
# then go to Actions -> "Build Blink IPA" -> "Run workflow".
#
# The source is checked out directly from blinksh/blink at the branch, tag or
# commit you choose, and the exact commit + SHA-256 of the .ipa are written to
# the run summary, so you always know which code went into your app.

name: Build Blink IPA

on:
  workflow_dispatch:
    inputs:
      team_id:
        description: "Your Apple Team ID (10 characters, e.g. AB12CD34EF). Needed so app storage works after SideStore signs the app."
        required: true
        type: string
      ref:
        description: "Blink branch, tag or commit to build"
        required: true
        default: "v18.6.0"
        type: string
      repo:
        description: "Source repository"
        required: true
        default: "blinksh/blink"
        type: string
      runner:
        description: "GitHub macOS runner"
        required: true
        default: "macos-latest"
        type: string
      xcode:
        description: "Xcode version to use, e.g. 26.0, or 'latest' for the newest non-beta Xcode on the runner"
        required: true
        default: "latest"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120

    env:
      TEAM_ID: ${{ inputs.team_id }}
      SRC_REF: ${{ inputs.ref }}
      SRC_REPO: ${{ inputs.repo }}
      XCODE_WANTED: ${{ inputs.xcode }}
      # Our own identifiers, so the build never clashes with the App Store Blink.
      APP_ID: selfbuilt.blinkshell
      GROUP_BASE: selfbuilt.blinkshell.shared

    steps:
      - name: Check Team ID
        run: |
          if ! [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::team_id must be exactly 10 capital letters/digits (got '$TEAM_ID')."
            exit 1
          fi

      - name: Get Blink source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode
        run: |
          if [ "$XCODE_WANTED" = "latest" ]; then
            XC=$(for x in /Applications/Xcode_*.app; do
                   case "$x" in *[Bb]eta*) ;; *) echo "$x" ;; esac
                 done | sort -V | tail -1)
          else
            XC="/Applications/Xcode_${XCODE_WANTED}.app"
          fi
          if [ ! -d "$XC" ]; then
            echo "::error::Xcode not found at $XC. Installed:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Download frameworks and resources
        run: |
          ./get_frameworks.sh
          ./get_resources.sh
          rm -rf Blink.xcodeproj/project.xcworkspace/xcshareddata/

      - name: Write developer_setup.xcconfig
        run: |
          cp template_setup.xcconfig developer_setup.xcconfig
          # Later lines override the template's values.
          cat >> developer_setup.xcconfig <<EOF

          // ---- overrides for a self-built, SideStore-signed copy ----
          TEAM_ID =
          BUNDLE_ID = ${APP_ID}
          KEYCHAIN_ID1 = ${APP_ID}
          CLOUD_ID = ${APP_ID}
          // SideStore renames app group "group.X" to "group.X.<TEAMID>",
          // so the app is told to look for that final name.
          GROUP_ID = ${GROUP_BASE}.${TEAM_ID}
          EOF
          tail -12 developer_setup.xcconfig

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Blink.app || {
            echo "::error::Build failed. Last lines of the log:"; tail -80 build.log; exit 1; }

      - name: Embed entitlements for SideStore
        # SideStore reads the app group from the app's embedded entitlements,
        # registers it on your free account and signs the app for real.
        # Here we only ad-hoc sign with a minimal, free-account-compatible set
        # (no iCloud, no push), so the app group carries over.
        run: |
          APP=build/Build/Products/Release-iphoneos/Blink.app
          cat > app.entitlements <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.application-groups</key>
            <array><string>group.${GROUP_BASE}</string></array>
          </dict></plist>
          EOF
          cp app.entitlements ext.entitlements

          # Sign nested code first (deepest first), then extensions, then the app.
          find "$APP" -depth \( -name "*.framework" -o -name "*.dylib" \) -print0 |
            while IFS= read -r -d '' f; do codesign -f -s - "$f"; done
          for ext in "$APP"/PlugIns/*.appex; do
            if [[ "$ext" == *BlinkFileProviderExtension.appex ]]; then
              codesign -f -s - --entitlements ext.entitlements "$ext"
            else
              codesign -f -s - "$ext"
            fi
          done
          codesign -f -s - --entitlements app.entitlements "$APP"
          codesign -d --entitlements - "$APP"

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Blink.app Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/Blink.app/Info.plist)
          BUILDNO=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" Payload/Blink.app/Info.plist)
          IPA="Blink-${VERSION}-${BUILDNO}-unsigned.ipa"
          zip -qry "$IPA" Payload
          echo "IPA=$IPA" >> "$GITHUB_ENV"

          SHA=$(shasum -a 256 "$IPA" | cut -d' ' -f1)
          COMMIT=$(git rev-parse HEAD)
          {
            echo "## Blink build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Source | [\`$SRC_REPO\` @ \`$SRC_REF\`](https://github.com/$SRC_REPO/commit/$COMMIT) |"
            echo "| Commit | \`$COMMIT\` |"
            echo "| Version | $VERSION (build $BUILDNO) |"
            echo "| Xcode | $(xcodebuild -version | head -1) |"
            echo "| File | \`$IPA\` |"
            echo "| SHA-256 | \`$SHA\` |"
            echo "| App group | \`group.$GROUP_BASE.$TEAM_ID\` (after SideStore signing) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .ipa
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.IPA }}
          path: ${{ env.IPA }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
